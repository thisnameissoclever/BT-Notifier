<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BT Notifier Support</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; }
    main { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
    .mark { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 18px; color: white; background: #1565c0; font-size: 42px; }
    h1 { margin: 24px 0 8px; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { line-height: 1.65; }
    a { color: #0d47a1; }
    .links { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 32px; }
    .links a { padding: 12px 16px; border: 1px solid #90a4c0; border-radius: 10px; text-decoration: none; background: white; }
    @media (prefers-color-scheme: dark) {
      :root { color: #eef3fc; background: #111722; }
      a { color: #90caf9; }
      .links a { background: #1b2535; border-color: #40516b; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ᛒ</div>
    <h1>BT Notifier</h1>
    <p>BT Notifier scans for nearby Bluetooth devices, keeps a local watch list, and can alert you when a watched device appears.</p>
    <div class="links">
      <a href="privacy-policy.html">Privacy policy</a>
      <a href="mailto:bt-notifier-support@stfuai.com">Email support</a>
    </div>
  </main>
</body>
</html>
