plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

layout.buildDirectory = rootProject.layout.buildDirectory.dir('app')

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def btNotifierDebugStoreFileProperty = localProperties.getProperty('btNotifierDebugStoreFile')
def btNotifierDebugStoreFile = btNotifierDebugStoreFileProperty != null ?
        rootProject.file(btNotifierDebugStoreFileProperty) :
        rootProject.file('.local-signing/bt-notifier-debug.keystore')
def btNotifierDebugStorePassword = localProperties.getProperty('btNotifierDebugStorePassword', 'android')
def btNotifierDebugKeyAlias = localProperties.getProperty('btNotifierDebugKeyAlias', 'androiddebugkey')
def btNotifierDebugKeyPassword = localProperties.getProperty('btNotifierDebugKeyPassword', 'android')
def hasBtNotifierDebugSigning =
        btNotifierDebugStoreFile.exists() &&
        btNotifierDebugStorePassword != null &&
        btNotifierDebugKeyAlias != null &&
        btNotifierDebugKeyPassword != null

def btNotifierUploadStoreFile = rootProject.file('.local-signing/bt-notifier-upload.jks')
def btNotifierUploadStorePassword = System.getenv('BT_NOTIFIER_UPLOAD_PASSWORD')
def btNotifierUploadKeyAlias = 'bt-notifier-upload'
def hasBtNotifierUploadSigning =
        btNotifierUploadStoreFile.exists() &&
        btNotifierUploadStorePassword != null &&
        !btNotifierUploadStorePassword.isBlank()

android {
    namespace = 'com.btnotifier'
    compileSdk = 37

    signingConfigs {
        if (hasBtNotifierDebugSigning) {
            btNotifierDebug {
                storeFile = btNotifierDebugStoreFile
                storePassword = btNotifierDebugStorePassword
                keyAlias = btNotifierDebugKeyAlias
                keyPassword = btNotifierDebugKeyPassword
            }
        }

        if (hasBtNotifierUploadSigning) {
            btNotifierUpload {
                storeFile = btNotifierUploadStoreFile
                storePassword = btNotifierUploadStorePassword
                keyAlias = btNotifierUploadKeyAlias
                keyPassword = btNotifierUploadStorePassword
            }
        }
    }

    defaultConfig {
        applicationId = "com.btnotifier"
        minSdk = 24
        targetSdk = 37
        versionCode = 4
        versionName = "1.1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            if (hasBtNotifierDebugSigning) {
                signingConfig = signingConfigs.btNotifierDebug
            }
        }

        release {
            if (hasBtNotifierUploadSigning) {
                signingConfig = signingConfigs.btNotifierUpload
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Room
    def roomVersion = '2.8.4'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
